<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Kucing KICAU MANIA 🎵</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(145deg, #ffd89b 0%, #c7e9fb 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", "Poppins", "Comic Neue", system-ui, cursive;
        padding: 20px;
        overflow-x: hidden;
      }

      .card {
        max-width: 600px;
        width: 100%;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        border-radius: 72px;
        border: 3px solid white;
        box-shadow:
          0 25px 45px rgba(0, 0, 0, 0.2),
          0 0 0 8px rgba(255, 215, 0, 0.4);
        padding: 28px 24px 40px;
        text-align: center;
      }

      h1 {
        font-size: 2.2rem;
        background: linear-gradient(135deg, #f6b93b, #f06a6a);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .trend-badge {
        background: #ff4d4d;
        border-radius: 60px;
        font-size: 0.8rem;
        padding: 5px 15px;
        color: white;
        font-weight: bold;
        box-shadow:
          inset 0 -1px 0 rgba(0, 0, 0, 0.1),
          0 3px 0 #a10000;
        transform: rotate(2deg);
      }

      .cat-stage {
        background: #fbe9c3;
        border-radius: 120px;
        margin: 25px 0 20px;
        padding: 30px 20px;
        box-shadow:
          inset 0 0 12px #cb9e6b,
          0 12px 24px rgba(0, 0, 0, 0.2);
      }

      .cat-dancer {
        display: inline-block;
        cursor: pointer;
        animation: catShake 0.45s infinite ease-in-out;
        transform-origin: center center;
      }

      .cat-dancer.hyper-dance {
        animation: catShake 0.28s infinite cubic-bezier(0.28, 0.85, 0.42, 1);
      }

      .cat-vector {
        width: 180px;
        height: 180px;
        display: block;
        margin: 0 auto;
        filter: drop-shadow(6px 12px 12px rgba(0, 0, 0, 0.2));
        border-radius: 50%;
        object-fit: cover;
      }

      @keyframes catShake {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        25% {
          transform: translate(5px, -4px) rotate(4deg);
        }
        50% {
          transform: translate(-4px, 2px) rotate(-3deg);
        }
        75% {
          transform: translate(3px, -2px) rotate(2deg);
        }
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
      }

      .music-panel {
        display: flex;
        gap: 18px;
        justify-content: center;
        margin: 25px 0 20px;
        flex-wrap: wrap;
      }

      .btn {
        border: none;
        padding: 12px 28px;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 50px;
        background: #ffb347;
        color: #3d2b1a;
        box-shadow: 0 6px 0 #b4621a;
        cursor: pointer;
        transition: 0.07s linear;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #b4621a;
      }

      .btn-music {
        background: #ff5e7c;
        color: white;
        text-shadow: 0 1px 1px black;
        box-shadow: 0 6px 0 #9e2c46;
      }

      .btn-stop {
        background: #5f5f5f;
        box-shadow: 0 6px 0 #353535;
        color: white;
      }

      .visualizer {
        background: #26221c;
        border-radius: 60px;
        padding: 10px 15px;
        margin: 20px 0 5px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .wave {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
        flex: 2;
      }

      .wave span {
        width: 6px;
        height: 25px;
        background: #feca57;
        border-radius: 10px;
        animation: bounceWave 0.4s infinite alternate ease;
      }

      .wave span:nth-child(2) {
        animation-delay: 0.1s;
        height: 38px;
        background: #ff9f4a;
      }
      .wave span:nth-child(3) {
        animation-delay: 0.2s;
        height: 18px;
      }
      .wave span:nth-child(4) {
        animation-delay: 0.3s;
        height: 45px;
        background: #ff6b4a;
      }
      .wave span:nth-child(5) {
        animation-delay: 0.15s;
        height: 28px;
      }

      @keyframes bounceWave {
        0% {
          transform: scaleY(0.6);
          opacity: 0.5;
        }
        100% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .status-text {
        font-weight: bold;
        background: #ffefc0;
        border-radius: 40px;
        padding: 8px 16px;
        font-size: 0.85rem;
        color: #a1540c;
      }

      .kicau-text {
        font-size: 1rem;
        background: #ffda9e;
        padding: 12px;
        border-radius: 50px;
        margin: 15px 0 0;
        font-weight: bold;
        color: #b44600;
      }

      footer {
        margin-top: 20px;
        font-size: 0.7rem;
        opacity: 0.7;
      }

      @media (max-width: 480px) {
        .card {
          padding: 20px 16px;
        }
        .cat-vector {
          width: 140px;
          height: 140px;
        }
        .btn {
          padding: 8px 16px;
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>
        🐈‍⬛ JOKO JOGET
        <span class="trend-badge">🔥 KICAU KICAU MANIA 🔥</span>
      </h1>

      <div class="cat-stage">
        <div class="cat-dancer" id="catDancer">
          <!-- GAMBAR: default hmmm.gif, nanti berubah jadi kicau.gif saat play -->
          <img
            id="catImage"
            class="cat-vector"
            src="asset/hmmm.gif"
            alt="Kucing Joget"
          />
        </div>
        <div class="kicau-text">
          🎶 KICAU... KICAU... MANIA! 🎶 <br />
          TEKAN PLAY & SI KUCING LANGSUNG JOGET 🕺🐱
        </div>
      </div>

      <div class="music-panel">
        <button class="btn btn-music" id="playBtn">🎵 PLAY MUSIK 🎵</button>
        <button class="btn btn-stop" id="stopBtn">⏹️ STOP / DIEM</button>
      </div>

      <div class="visualizer">
        <div class="wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="status-text" id="musicStatus">
          🎧 Klik PLAY buat denger Kicau Mania!
        </div>
      </div>
    </div>

    <script>
      (function () {
        // DOM elements
        const playBtn = document.getElementById("playBtn");
        const stopBtn = document.getElementById("stopBtn");
        const musicStatus = document.getElementById("musicStatus");
        const catDancer = document.getElementById("catDancer");
        const catImage = document.getElementById("catImage");

        // Audio elements
        let audio = null;
        let isPlaying = false;

        // Fungsi untuk memutar lagu (menggunakan file MP3 eksternal)
        function playMusic() {
          if (isPlaying) return;

          // Buat objek Audio jika belum ada
          if (!audio) {
            audio = new Audio("asset/dj-kicau-mania.mp3"); // PASTIKAN FILE MP3 ADA DI FOLDER SAMA DENGAN NAMA INI
            audio.loop = true; // loop agar lagu terus berulang
            audio.volume = 0.8;
            // Jika file tidak ditemukan, beri error
            audio.onerror = () => {
              musicStatus.innerText =
                '❌ File lagu tidak ditemukan! Letakkan "asset/dj-kicau-mania.mp3" di folder yang sama.';
              console.error("Audio file not found");
            };
          }

          // Reset posisi jika sedang pause di tengah
          if (audio.paused) {
            audio
              .play()
              .then(() => {
                isPlaying = true;
                musicStatus.innerText =
                  "🎶 KICAU-KICAU MANIA ON FIRE! 🔥 KUCING JOGET NGACIR 🐱💨";
                catImage.src = "asset/kicau.gif"; // Ganti gambar jadi kicau.gif
                catDancer.classList.add("hyper-dance"); // Joget kenceng
              })
              .catch((err) => {
                console.warn("Gagal memutar audio:", err);
                musicStatus.innerText = "⚠️ Gagal memutar musik, cek file MP3";
              });
          } else {
            // jika sedang bermain (seharusnya tidak masuk sini karena isPlaying false, tapi amankan)
            audio.currentTime = 0;
            audio.play();
            isPlaying = true;
            catImage.src = "asset/kicau.gif";
            catDancer.classList.add("hyper-dance");
            musicStatus.innerText = "🎶 KICAU-KICAU MANIA ON FIRE! 🔥";
          }
        }

        // Fungsi menghentikan lagu
        function stopMusic() {
          if (audio) {
            audio.pause();
            audio.currentTime = 0;
          }
          isPlaying = false;
          catImage.src = "asset/hmmm.gif"; // Kembali ke gambar tenang
          catDancer.classList.remove("hyper-dance"); // Joget normal saja (tetap ada animasi dasar)
          musicStatus.innerText = "⏸️ Musik dihentikan | Kucing istirahat 🐈";
        }

        // Event listeners
        playBtn.addEventListener("click", () => {
          // Jika sedang bermain, stop dulu lalu play ulang? Biar fresh
          if (isPlaying) {
            stopMusic();
          }
          playMusic();
        });

        stopBtn.addEventListener("click", () => {
          stopMusic();
        });

        // Animasi dasar (joget ringan) tanpa hyper-dance
        catDancer.style.animation = "catShake 0.45s infinite ease-in-out";
        musicStatus.innerText =
          "🎧 Klik PLAY buat denger Kicau Mania! Kucing siap joget";

        // Jika halaman di-load dan tidak ada interaksi, gambar default hmmm.gif sudah terpasang
      })();
    </script>
  </body>
</html>
